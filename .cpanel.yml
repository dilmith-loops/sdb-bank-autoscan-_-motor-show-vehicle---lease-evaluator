---
deployment:
  tasks:
    # Deployment destination path for the Node.js application
    - export DEPLOYPATH=/home/${USER:-slmalzxh}/uat.loopsintegrated.co/sdb
    - /bin/mkdir -p $DEPLOYPATH
    # Copy all application files to deployment path
    - /bin/cp -R * $DEPLOYPATH
    # Ensure dotfiles like .htaccess are copied (Passenger configuration)
    - /bin/cp -f .htaccess $DEPLOYPATH 2>/dev/null || true
    - /bin/mkdir -p $DEPLOYPATH/tmp
    # Trigger CloudLinux Phusion Passenger restart
    - /bin/touch $DEPLOYPATH/tmp/restart.txt

